<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Completar Perfil del Proveedor</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        form {
            max-width: 400px;
            margin: auto;
        }

        label {
            display: block;
            margin-top: 10px;
        }

        textarea {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
        }

        select {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
        }

        button {
            margin-top: 15px;
            padding: 10px;
            background: #28a745;
            color: #fff;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background: #1e7e34;
        }

    </style>
</head>
<body>
    <h1>Completa tu Perfil</h1>
    <p>Antes de continuar, rellena estos datos para ofrecer tus servicios.</p>
    <form method="POST">

        <label for="categoria">Categoría de Servicio:</label>
        <select id="categoria" name="categoria" required>
            <option value="">Selecciona una</option>
            <option value="electricidad">Electricidad</option>
            <option value="plomeria">Plomería</option>
            <option value="gas">Gas</option>
            <option value="aires_acondicionados">Instalación de Aires Acondicionados</option>
        </select>
        
        <label for="descripcion">Descripción Detallada:</label>
        <textarea id="descripcion" name="descripcion" rows="5" placeholder="Describe tu experiencia..." required></textarea>
        
        <button type="submit">Guardar y Continuar</button>
    </form>
</body>
</html>
