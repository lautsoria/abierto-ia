<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href='{{ url_for('static', filename='css/register.css', external='true') }}'>
  <title>Login</title>
</head>

<body>
<div class="Formulario" >
    <div class="flip-card" id="flipCard">
        <div class="flip-card-inner">
            <div class="flip-card-front">
                <form id="loginForm">

                
                <h1>Login</h1>
                <input type="text" id="nombre" name="fnombre" placeholder="Nombre de usuario" required>
                <input type="password" id="Contraseña" name="fcontraseña" placeholder="Contraseña" required>
                <div style="position: relative;">
                    
                        <input type="checkbox" id="recordarContraseña">
                    
                    <label for="recordarContraseña">Recordar Constraseña</label>
                    <div class="password-toggle" onclick="togglePasswordVisibility()">

                        
                    </div>
                </div>
                <button type= "submit">Iniciar Sesion</button>

            </form>
            <span class="toggle-text" id="Registertext">Registrarse</span>
            </div>
            <div class="flip-card-back">
                <form id= "registerForm">
                <h1 >Registrate</h1>
                <input type="text" id="newUsername" name="fnewUsername" placeholder="Nombre de usuario" required>
                <input type="email" id="email" name="femail" placeholder="Correo electrónico" required>
                <input type="password" id="newpassword" name="fnewpassword" placeholder="Contraseña" required>
                <input type="password" id="newpassword2" name="fnewpassword2" placeholder="Repetir Contraseña" required>
                <div class="proveedor-checkbox">
                    <input type="checkbox" id="isProveedor" name="isProveedor">
                    <label for="isProveedor">Soy proveedor</label>
                </div>
                <button type="submit">Registrarse</button>
                </form>
                <span class="toggle-text" id="loginText">volver al <strong class="resaltado">Inicio de Sesion</strong></span>
            </div>
            
                
            
        </div>
    </div>
    
</div>
<script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
