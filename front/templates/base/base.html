<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href='{{ url_for('static', filename='css/base.css', external='true') }}'>
  <title>{% block title %}Base{% endblock %}</title>
</head>

<body>
  <header class="header">
    <div class="header-top">
      <div class="header-left">
        <div class="logo">
          <span class="logo-icon">🤝</span>
          <span class="logo-text">Mercado<br><strong>Servicios</strong></span>
        </div>
        <div class="location">
          <span class="location-icon">📍</span>
          <div>
            <span class="location-label">Enviar a</span>
            <span class="location-text">Capital Federal</span>
          </div>
        </div>
      </div>

      <div class="header-center">
        <form class="search-form" role="search">
          <input 
            type="text" 
            class="search-input" 
            placeholder="Buscar productos, marcas y más…" 
            maxlength="120"
          >
          <button type="submit" class="search-btn">🔍</button>
        </form>
      </div>

      <!-- <div class="header-right">
        <button class="promo-btn">ENVÍO GRATIS<br><strong>EN TU PRIMERA COMPRA</strong></button>
      </div> -->
    

      <nav class="header-nav">
        <a href="#" class="nav-link">Categorías</a>
        <a href="#" class="nav-link">Ofertas</a>
        <a href="#" class="nav-link end">Ingresá</a>
        <a href="#" class="nav-link">Mis </a>
        <a href="#" class="nav-link">Ver Carrito 🛒</a>
      </nav>
    </div>
  </header>
  {% block content %}
  {% endblock %}
  <footer>

  </footer>
  {% block scripts %}
  {% endblock %}
</body>
</html>
