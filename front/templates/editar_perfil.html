{% extends "base/base.html" %}
{% block title %}Editar Perfil{% endblock %}
{% block styles %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/editar_perfil.css') }}">
{% endblock %}
{% block content %}
    <div class="editar-perfil-container">
        <div class="profile-card">
        <div class="card-header">
            <h4>✏️ Editar Perfil de {{data.rol|capitalize }}</h4>
        </div>
        
        <div class="card-body">
            
            <form action="{{ url_for('usuarios.perfil') }}" method="POST" id="editForm">
                
                <h5 class="form-section-title">Datos Personales</h5>
                
                <div class="form-group">
                    <label>Nombre Completo</label>
                    <input type="text" name="nombre" value="{{ usuario.usuario }}" required>
                </div>

                <div class="form-row form-group">
                    <div>
                        <label>Email</label>
                        <input type="email" name="email" value="{{ usuario.email }}" required>
                    </div>
                    <div>
                        <label>Teléfono</label>
                        <input type="text" name="telefono" value="{{ usuario.telefono }}">
                    </div>
                </div>

                <!-- {% if usuario.rol == 'proveedor' %}
                    <hr>
                    <h5 class="form-section-title">Datos Profesionales</h5>
                    
                    <div class="alert-info">
                        <small>ℹ️ Estos datos son públicos para tus clientes.</small>
                    </div>

                    <div class="form-group">
                        <label>Profesión / Oficio</label>
                        <input type="text" name="profesion" value="{{ usuario.profesion }}">
                    </div>

                    <div class="form-group">
                        <label>Descripción / Presentación</label>
                        <textarea name="descripcion" rows="3">{{ usuario.descripcion }}</textarea>
                    </div>
                {% endif %} -->

            </form>

            <div class="btn-container">
                <button type="submit" form="editForm" class="btn btn-success">Guardar Cambios</button>
                
                <div class="secondary-btns">
                    <form action="{{ url_for('auth.logout') }}" method="POST">
                        <button type="submit" class="btn btn-danger">Cerrar Sesión</button>
                    </form>
                    
                    <a href="{{ url_for('home') }}" class="btn btn-secondary">Cancelar</a>
                </div>
            </div>

        </div>
        </div>
    </div>
{% endblock %}
