{% extends "base/base.html" %}

{% block styles %}
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
{% endblock %}

{% block content %}
<body class="bg-light">

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow">
                <div class="card-header bg-primary text-white">
                    <h4>✏️ Editar Perfil ({{ usuario.rol }})</h4>
                </div>
                <div class="card-body">
                    
                    <form action="/perfil/editar" method="POST">
                        
                        <h5 class="mb-3 text-muted">Datos Personales</h5>
                        
                        <div class="mb-3">
                            <label class="form-label">Nombre Completo</label>
                            <input type="text" name="nombre" class="form-control" value="{{ usuario.nombre }}" required>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Email</label>
                                <input type="email" name="email" class="form-control" value="{{ usuario.email }}" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Teléfono</label>
                                <input type="text" name="telefono" class="form-control" value="{{ usuario.telefono }}">
                            </div>
                        </div>

                        {% if usuario.rol=='proveedor' %}
                            <hr>
                            <h5 class="mb-3 text-muted">Datos Profesionales</h5>
                            <div class="alert alert-info py-2">
                                <small>ℹ️ Estos datos son públicos para tus clientes.</small>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Profesión / Oficio</label>
                                <input type="text" name="profesion" class="form-control" value="{{ usuario.get('categoria', 'no hay categoria') }}">
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Descripción / Presentación</label>
                                <textarea name="descripcion" class="form-control" rows="3">{{ usuario.get('descripcion''no hay descripcion') }}</textarea>
                            </div>
                        {% endif %}
                        <div class="d-grid gap-2 mt-4">
                            <button type="submit" class="btn btn-success btn-lg">Guardar Cambios</button>
                            <a href="#" class="btn btn-secondary">Cancelar</a>
                        </div>

                    </form>

                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
