<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href='{{ url_for('static', filename='css/editar_perfil.css', external='true') }}'>

    <title>Editar Perfil</title>
</head>
<body>

    <div class="profile-card">
        <div class="card-header">
            <h4>✏️ Editar Perfil ({{ usuario.rol|capitalize }})</h4>
        </div>
        
        <div class="card-body">
            
            <form action="/perfil/editar" method="POST">
                
                <h5 class="form-section-title">Datos Personales</h5>
                
                <div class="form-group">
                    <label>Nombre Completo</label>
                    <input type="text" name="nombre" value="{{ usuario.nombre }}" required>
                </div>

                <div class="form-row form-group">
                    <div>
                        <label>Email</label>
                        <input type="email" name="email" value="{{ usuario.email }}" required>
                    </div>
                    <div>
                        <label>Teléfono</label>
                        <input type="text" name="telefono" value="{{ usuario.telefono }}">
                    </div>
                </div>

                {% if usuario.rol == 'proveedor' %}
                    <hr>
                    <h5 class="form-section-title">Datos Profesionales</h5>
                    
                    <div class="alert-info">
                        <small>ℹ️ Estos datos son públicos para tus clientes.</small>
                    </div>

                    <div class="form-group">
                        <label>Profesión / Oficio</label>
                        <input type="text" name="profesion" value="{{ usuario.profesion }}">
                    </div>

                    <div class="form-group">
                        <label>Descripción / Presentación</label>
                        <textarea name="descripcion" rows="3">{{ usuario.descripcion }}</textarea>
                    </div>
                {% endif %}

                <div class="btn-container">
                    <button type="submit" class="btn btn-success">Guardar Cambios</button>
                    <a href="#" class="btn btn-secondary">Cancelar</a>
                </div>

            </form>

        </div>
    </div>

</body>
</html>
